{% extends "base.html" %}
{% block title %}{{ t('error') }} · {{ t('app') }}{% endblock %}
{% block content %}
<h1>{{ t('error') }}</h1>
<div class="flash warn-border" role="alert">{{ message }}</div>
<p><a class="btn" href="{{ url_for('home') }}">{{ t('nav_home') }}</a></p>
<p class="muted" style="font-size: 12px;">HTTP {{ code }}</p>
{% endblock %}
